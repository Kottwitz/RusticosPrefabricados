<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - Rústicos</title>
  
  <style>
    /* Tema Escuro Profissional para o Decap CMS */
    body {
      background-color: #121212 !important;
      color: #e5e5e5 !important;
      font-family: 'Open Sans', sans-serif !important;
    }

    /* Ajuste da barra de topo e barras laterais */
    [class*="AppHeader"] {
      background-color: #1a1a1a !important;
      border-bottom: 1px solid #2a2a2a !important;
    }

    [class*="SidebarContainer"] {
      background-color: #181818 !important;
      border-right: 1px solid #2a2a2a !important;
    }

    /* Cartões de coleções e blocos principais */
    [class*="CollectionPage"] {
      background-color: #121212 !important;
    }

    [class*="CollectionCard"], [class*="Pane"], div[data-slate-editor] {
      background-color: #1e1e1e !important;
      color: #ffffff !important;
      border-color: #2a2a2a !important;
    }

    /* Caixas de pesquisa e títulos de painel */
    input[type="text"], textarea, select {
      background-color: #1a1a1a !important;
      color: #ffffff !important;
      border: 1px solid #333 !important;
    }

    input:focus, textarea:focus {
      border-color: #d95d39 !important;
    }

    /* Mantém os botões principais consistentes com a identidade do site */
    button[class*="Button"]:not([class*="Medium"]) {
      background-color: #d95d39 !important;
      color: #ffffff !important;
      border-radius: 6px !important;
    }

    button[class*="Button"]:hover {
      background-color: #b94b2a !important;
    }
  </style>
</head>
<body>
  <!-- Script do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
